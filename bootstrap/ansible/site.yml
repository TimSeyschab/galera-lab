---
- name: Prepare all lab nodes
  hosts: all
  become: true
  gather_facts: true
  roles:
    - common

- name: Install the single K3s control plane
  hosts: k3s_admin
  become: true
  gather_facts: true
  roles:
    - k3s_server

- name: Join all configured workers to K3s
  hosts: k3s_workers
  become: true
  gather_facts: true
  roles:
    - k3s_agent

- name: Verify the K3s topology
  hosts: k3s_admin
  become: true
  gather_facts: false
  tasks:
    - name: Label nodes with their OpenTofu role
      ansible.builtin.command: >-
        k3s kubectl label node {{ item }} lab.galera/role={{ hostvars[item].node_role }} --overwrite
      loop: "{{ groups['all'] }}"
      changed_when: true

    - name: Read cluster nodes
      ansible.builtin.command: k3s kubectl get nodes -o wide
      register: k3s_nodes
      changed_when: false

    - name: Print cluster nodes
      ansible.builtin.debug:
        var: k3s_nodes.stdout_lines
