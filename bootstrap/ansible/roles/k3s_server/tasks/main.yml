---
- name: Require a pinned K3s version
  ansible.builtin.assert:
    that:
      - k3s_version | length > 0
    fail_msg: "Set K3S_VERSION to a pinned K3s release before running Ansible."

- name: Check whether K3s server is installed
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: k3s_server_service

- name: Install the K3s server
  ansible.builtin.shell: |
    curl --fail --silent --show-error --location https://get.k3s.io | \
      INSTALL_K3S_VERSION={{ k3s_version | quote }} sh -s - server \
        --cluster-init \
        --disable traefik \
        --disable servicelb \
        --node-ip {{ private_ip | quote }} \
        --flannel-iface {{ k3s_private_interface | quote }} \
        --tls-san {{ private_ip | quote }} \
        --tls-san {{ ansible_host | quote }} \
        --write-kubeconfig-mode 0640
  args:
    executable: /bin/bash
  when: not k3s_server_service.stat.exists
  no_log: true
  notify: Restart k3s server

- name: Ensure K3s server is enabled and started
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Read the generated K3s agent token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: generated_k3s_token
  no_log: true

- name: Keep the generated token in Ansible memory for this run
  ansible.builtin.set_fact:
    k3s_join_token: "{{ generated_k3s_token.content | b64decode | trim }}"
  no_log: true
